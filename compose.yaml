name: doodleroom
services:
  mongo:
    image: mongo:8.0
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  server:
    build: { context: ., target: server }
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/doodleroom}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      MAX_ROOMS: ${MAX_ROOMS:-200}
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      HTTP_RATE: ${HTTP_RATE:-5}
      SOCKET_CONNECTION_RATE: ${SOCKET_CONNECTION_RATE:-5}
      ROOM_CREATE_RATE: ${ROOM_CREATE_RATE:-5}
    depends_on: { mongo: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: { context: ., target: web }
    environment: { GAME_SERVER_URL: "http://server:4000" }
    depends_on: [server]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    ports: ["${PORT:-3000}:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      web: { condition: service_healthy }
      server: { condition: service_healthy }
    restart: unless-stopped
volumes:
  mongo-data:
